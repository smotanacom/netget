    "ollama",
    "oauth2",
    "jsonrpc",
    "ipsec",
    "bgp",
    # isis excluded: needs libpcap (not present on Windows runners)
    "rip",
    "bitcoin",
    "mcp",
    "grpc",
    "xmlrpc",
    "vnc",
    "reverse-shell",
