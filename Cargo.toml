[package]
name = "netget"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/smotanacom/netget"

[features]
default = ["all-protocols"]

# Terminal snapshot testing (PTY-based TUI tests)
terminal-snapshot = []

# GPU monitoring (cross-platform: NVIDIA, AMD, Intel)
gpu = ["dep:gfxinfo"]

# Android Termux: Pure-Rust protocols compatible with Android/Termux environment
# (portable-base plus isis, which sniffs L2 frames via libpcap — available on Termux).
android-termux = ["portable-base", "isis"]

# Portable base: pure-Rust protocols with NO system-library dependency at link
# or runtime. Excludes: BLE (needs BlueZ), NFC (needs PC/SC), USB (needs USB/IP),
# packet capture / isis (needs libpcap), STUN/TURN (old nix crate),
# WireGuard/OpenVPN (not gated for Android). Uses vendored OpenSSL.
portable-base = [
    "dep:openssl-sys",  # Force vendored OpenSSL compilation from source
    "tcp",
    "socket_file",
    "http",
    "http2",
    "quic",
    "http3",
    "pypi",
    "maven",
    "udp",
    "dc",
    "dns",
    "dot",
    "doh",
    "dhcp",
    "bootp",
    "ntp",
    "whois",
    "snmp",
    "igmp",
    "syslog",
    "ssh",
    "ssh-agent",
    "svn",
    "irc",
    "xmpp",
    "telnet",
    "smtp",
    "mdns",
    "mysql",
    "mssql",
    "snowflake",
    "db2",
    "ipp",
    "postgresql",
    "mongodb-server",
    "mongodb",
    "memcached",
    "radius",
    "redis",
    "rss",
    "proxy",
    "webdav",
    "nfs",
    "cassandra",
    "smb",
    # STUN/TURN excluded (use old nix-0.8.1 crate incompatible with modern Rust)
    "webrtc",
    "sip",
    "rtp",
    "rtsp",
    "hls",
    "ldap",
    "imap",
    "pop3",
    "nntp",
    "mqtt",
    "modbus",
    "coap",
    "amqp",
    "socks5",
    "elasticsearch",
    "couchdb",
    "yarn",
    "spark",
    "dynamo",
    "s3",
    "sqs",
    "npm",
    "oci-registry",
    "openai",
    "ollama",
    "oauth2",
    "jsonrpc",
    # WireGuard/OpenVPN excluded (platform-specific, not gated for Android)
    "ipsec",
    "bgp",
    # OSPF excluded (requires raw sockets/root)
    # isis moved to android-termux wrapper (needs libpcap)
    "rip",
    "bitcoin",
    "mcp",
    "grpc",
    "xmlrpc",
    "tor",
    "vnc",
    "reverse-shell",
    "rdp",
    "openapi",
    "openid",
    "git",
    "mercurial",
    "kafka",
    "kubernetes",
    "kubernetes-server",
    "etcd",
    "zookeeper",
    "torrent-tracker",
    "torrent-dht",
    "torrent-peer",
    "tls",
    "saml-idp",
    "saml-sp",
    # BLE protocols excluded (need BlueZ on Linux, not available on Android)
    # NFC protocols excluded (need PC/SC library, not on Android)
    # USB protocols excluded (need USB/IP kernel module)
    # DataLink/ARP excluded (need libpcap and root access)
]

tcp = []
socket_file = []  # Unix domain socket server & client for IPC (Unix/Linux/macOS only, gated with #[cfg(unix)]), no extra deps
named_pipe = []  # POSIX named pipe (mkfifo FIFO) server, impersonates an OS-level IPC endpoint (Unix only, #[cfg(unix)]), no extra deps
pty = []  # Pseudo-terminal (openpty) server, LLM role-plays a program on a terminal (Unix only, #[cfg(unix)]); libc only, no extra deps
stdio = []  # NetGet as a stdin/stdout/stderr pipe filter, LLM drives the streams (Unix only, #[cfg(unix)]); refuses under TUI/--mcp; no extra deps
http = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "urlencoding"]
http2 = ["dep:h2", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen"]
pypi = ["http", "urlencoding"]  # PyPI (Python Package Index) uses HTTP and URL encoding for search (PEP 503 Simple Repository API)
maven = []  # Maven repository server (HTTP-based artifact distribution)
udp = []
datalink = ["dep:pcap"]  # DataLink sniffs L2 frames via libpcap
arp = ["pnet", "dep:pcap"]  # ARP (Address Resolution Protocol) uses pnet for packet handling + libpcap for capture
icmp = ["pnet", "socket2/all"]  # ICMP (Internet Control Message Protocol) uses pnet for packet handling + raw sockets (requires socket2 'all' feature for Type::RAW)
dc = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]  # DC (Direct Connect) - supports TLS (DCCS)
dns = ["hickory-server", "hickory-proto", "dep:hickory-client"]
dot = ["dns", "hickory-server/dns-over-rustls", "hickory-proto/dns-over-rustls", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:webpki-roots"]  # DNS-over-TLS server
doh = ["dns", "hickory-server/dns-over-https-rustls", "hickory-proto/dns-over-https-rustls", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:h2"]  # DNS-over-HTTPS server
dhcp = ["dhcproto"]
bootp = ["dhcproto"]  # BOOTP (Bootstrap Protocol) - DHCP predecessor, uses same packet format
ntp = ["dep:rsntp"]  # NTP client support
tftp = []  # TFTP (Trivial File Transfer Protocol) server and client - custom implementation, no dependencies
bluetooth-ble-client = ["btleplug"]  # Bluetooth Low Energy (BLE) client for connecting to BLE devices
bluetooth-ble = ["ble-peripheral-rust"]  # Bluetooth Low Energy (BLE) GATT server (peripheral mode)
nfc = []  # Virtual NFC tag over a TCP socket (vpcd framing). Needs no PC/SC: the server IS the card, and card emulation via a PC/SC reader is not possible
nfc-client = ["dep:pcsc"]  # NFC reader/writer client via PC/SC (ISO14443, APDU, NDEF)
bluetooth-ble-keyboard = ["bluetooth-ble"]  # BLE HID keyboard server
bluetooth-ble-mouse = ["bluetooth-ble"]  # BLE HID mouse server
bluetooth-ble-beacon = ["bluetooth-ble", "dep:bluer"]  # BLE beacon (iBeacon, Eddystone) - advertising payload needs BlueZ (Linux only)
bluetooth-ble-remote = ["bluetooth-ble"]  # BLE media remote control
bluetooth-ble-battery = ["bluetooth-ble"]  # BLE Battery Service
bluetooth-ble-heart-rate = ["bluetooth-ble"]  # BLE Heart Rate Service
bluetooth-ble-thermometer = ["bluetooth-ble"]  # BLE Health Thermometer
bluetooth-ble-environmental = ["bluetooth-ble"]  # BLE Environmental Sensing
bluetooth-ble-proximity = ["bluetooth-ble"]  # BLE Proximity/Find Me
bluetooth-ble-gamepad = ["bluetooth-ble"]  # BLE HID gamepad
bluetooth-ble-presenter = ["bluetooth-ble"]  # BLE presentation clicker
bluetooth-ble-file-transfer = ["bluetooth-ble"]  # BLE file transfer
bluetooth-ble-data-stream = ["bluetooth-ble"]  # BLE real-time data streaming
bluetooth-ble-cycling = ["bluetooth-ble"]  # BLE Cycling Speed and Cadence
bluetooth-ble-running = ["bluetooth-ble"]  # BLE Running Speed and Cadence
bluetooth-ble-weight-scale = ["bluetooth-ble"]  # BLE Weight Scale
whois = []  # WHOIS uses only TCP, no extra deps
snmp = ["rasn-snmp", "rasn", "rasn-smi", "dep:snmp"]
igmp = []  # IGMP multicast group management, no extra deps
syslog = ["syslog_loose"]
ssh = ["russh", "russh-keys", "russh-sftp", "dep:ssh2"]
ssh-agent = ["dep:ssh-agent-lib", "dep:tempfile"]  # SSH Key Agent protocol (server and client for key management)
svn = []  # SVN (Subversion) uses only TCP, no extra deps
irc = ["dep:irc"]  # IRC client support
xmpp = ["dep:tokio-xmpp", "dep:xmpp-parsers"]  # XMPP/Jabber instant messaging client
telnet = ["nectar"]
smtp = ["rust-smtp-server", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:lettre"]
ftp = []  # FTP (File Transfer Protocol) server and client - manual implementation, no extra deps
mdns = ["mdns-sd"]
mysql = ["dep:opensrv-mysql", "dep:mysql_async"]
mssql = ["dep:tiberius"]
snowflake = []  # Snowflake data-warehouse server (REST/JSON login + query protocol; hand-rolled over hyper, no extra deps)
db2 = []  # IBM Db2 DRDA wire-protocol server (hand-rolled DRDA/DDM handshake + basic query, no extra deps)
ipp = ["dep:ipp"]
postgresql = ["dep:pgwire", "dep:tokio-postgres"]
mongodb-server = ["dep:bson"]  # MongoDB server with LLM-controlled database operations
mongodb = ["dep:mongodb", "dep:bson"]  # MongoDB client
memcached = []  # Memcached text-protocol server - hand-rolled, no dependencies, stores nothing
radius = ["dep:md-5"]  # RADIUS AAA server (RFC 2865/2866) - hand-rolled codec, md-5 for the authenticators
redis = ["dep:redis-protocol", "dep:redis"]
rss = ["dep:rss"]  # RSS feed server and client (RSS 2.0 XML generation and parsing)
proxy = ["http-mitm-proxy", "dep:rcgen", "tokio-native-tls", "native-tls", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
http_proxy = ["http-mitm-proxy", "dep:rcgen", "tokio-native-tls", "native-tls", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots"]  # HTTP proxy (alternate name)
webdav = ["dep:reqwest_dav"]  # dav-server dropped: the server answers DAV verbs directly
nfs = ["nfsserve", "dep:nfs3_client", "dep:nfs3_types"]
cassandra = ["dep:cassandra-protocol", "tcp", "dep:scylla"]
smb = ["smb-msg"]
stun = ["dep:webrtc-stun", "dep:stunclient"]
smb-client = ["smb", "pavao"]  # SMB client requires native libsmbclient library
turn = ["dep:webrtc-turn"]
webrtc = ["dep:webrtc", "dep:tokio-tungstenite"]  # WebRTC client + server for peer-to-peer data channels
# Generic WebSocket (RFC 6455) server + client. Reuses the tokio-tungstenite 0.21 already in
# the tree for `webrtc`: framing, masking, fragmentation, ping/pong and the close handshake.
# Bumping that crate is a webrtc-wide decision, so this feature deliberately does not force one.
# No system library, hence present in dist / dist-windows (and dist-darwin via dist).
websocket = ["dep:tokio-tungstenite"]
sip = []  # SIP uses only UDP, no extra deps (manual protocol implementation)
rtp = []  # RTP (RFC 3550) media server; G.711 synthesis + packetizer, no system library
rtsp = ["rtp"]  # RTSP (RFC 2326) control server; reuses the rtp media engine for PLAY
hls = []  # HLS (RFC 8216) over minimal HTTP/1.1; no system library
ldap = ["dep:ldap3_proto", "rasn", "dep:ldap3"]
imap = ["imap-codec", "dep:async-imap", "dep:async-native-tls"]  # IMAP uses imap-codec for protocol parsing
pop3 = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots", "dep:rcgen"]  # POP3 email retrieval (manual implementation with TLS support)
nntp = []  # NNTP (Network News Transfer Protocol) for Usenet, uses only TCP, no extra deps
mqtt = ["dep:rumqttd", "dep:rumqttc"]  # MQTT broker and client for IoT messaging
modbus = []  # Modbus TCP server (ICS/SCADA) - hand-rolled MBAP+PDU codec, no extra deps
coap = []  # CoAP server (RFC 7252, IoT over UDP) - hand-rolled codec, no extra deps
amqp = ["dep:lapin"]  # AMQP broker and client for RabbitMQ compatibility
socks5 = ["dep:tokio-socks"]  # SOCKS5 server and client (client uses tokio-socks)
elasticsearch = []  # Elasticsearch uses only HTTP, no extra deps
couchdb = ["dep:couch_rs", "dep:form_urlencoded"]  # CouchDB server and client (server uses HTTP, client uses couch_rs)
yarn = []  # Hadoop YARN ResourceManager REST server - HTTP only, no extra deps
spark = []  # Apache Spark monitoring REST server - HTTP only, no extra deps
dynamo = ["aws-config", "aws-sdk-dynamodb", "aws-smithy-types", "dep:aws-credential-types"]  # DynamoDB client
dynamodb = ["aws-config", "aws-sdk-dynamodb", "aws-smithy-types", "dep:aws-credential-types"]  # DynamoDB client (alternate name)
s3 = ["aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types", "dep:rust-s3"]  # S3 client
sqs = ["aws-config", "aws-sdk-sqs"]  # AWS SQS queue
npm = ["http", "urlencoding"]  # NPM registry server and client (built on HTTP, uses urlencoding for search queries)
oci-registry = ["dep:sha2"]  # OCI Distribution v2 container registry server (pull path). Serves HTTP over hyper directly (unconditional dep) and needs sha2 for real content digests; links no system library, so it is in every dist set
openai = ["async-openai"]  # OpenAI API client
ollama = []  # Ollama API server and client (uses existing reqwest, no extra deps)
oauth2 = ["dep:oauth2", "urlencoding"]  # OAuth2 authorization server and client
jsonrpc = []  # JSON-RPC 2.0 server uses only HTTP, no extra deps
saml-idp = []  # SAML Identity Provider (authentication, assertion generation)
saml-sp = ["urlencoding"]  # SAML Service Provider (assertion validation, session management)
saml = ["quick-xml", "urlencoding", "dep:flate2"]  # SAML client (SP-initiated SSO, assertion validation)
wireguard = ["dep:defguard_wireguard_rs", "dep:x25519-dalek"]  # Full WireGuard VPN server with LLM control
openvpn = ["dep:tun", "dep:aes-gcm", "dep:chacha20poly1305", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:sha2", "dep:hmac", "dep:hkdf"]  # Full OpenVPN VPN server with TLS control channel and data channel encryption
ipsec = []  # IPSec/IKEv2 honeypot (packet detection only, no full crypto)
bgp = ["netgauze-bgp-pkt"]  # BGP routing protocol
ospf = ["udp"]  # OSPF routing protocol (IP protocol 89, raw sockets, requires root/CAP_NET_RAW, tests use UDP)
isis = ["dep:pcap"]  # IS-IS routing protocol (Intermediate System to Intermediate System) - sniffs L2 frames via libpcap
rip = []  # RIP (Routing Information Protocol) v2 - distance-vector routing
bitcoin = ["dep:bitcoin"]  # Bitcoin P2P protocol server (LLM-controlled, not a real full node)
mcp = ["dep:axum", "dep:tower-http"]  # Model Context Protocol (JSON-RPC 2.0 over HTTP/SSE)
grpc = ["dep:tonic", "dep:prost", "dep:prost-reflect", "dep:prost-types", "dep:tonic-reflection", "dep:tower", "dep:tempfile"]  # gRPC server with dynamic schema support
etcd = ["grpc", "dep:etcd-client"]  # etcd v3 key-value store server (KV service via gRPC)
zookeeper = ["dep:zookeeper-async"]  # ZooKeeper distributed coordination server and client with binary protocol support
xmlrpc = ["quick-xml", "dep:xmlrpc"]  # XML-RPC server and client with LLM-controlled method execution
tor = ["dep:tor-netdoc", "dep:tor-cert", "dep:tor-cell", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:ed25519-dalek", "dep:x25519-dalek", "dep:sha2", "dep:aes", "dep:ctr", "dep:hmac", "dep:hkdf", "dep:arti-client", "dep:tor-rtcompat", "dep:tor-dirmgr", "dep:tor-netdir"]  # Tor directory mirror and OR protocol relay (Guard/Middle/Exit) with cell handling + client with directory queries
vnc = []  # VNC server and client with custom RFB protocol implementation
reverse-shell = []  # Reverse-shell listener EMULATION (red-team/CTF); model role-plays the shell, nothing is executed
rdp = []  # RDP server: TPKT/X.224 connection-negotiation slice of [MS-RDPBCGR] (hand-rolled, no crate)
openapi = ["http", "dep:openapi-rs", "dep:matchit"]  # OpenAPI 3.1 server with runtime request validation and route matching
openid = ["urlencoding"]  # OpenID Connect authentication provider with LLM-controlled token generation
usb-common = ["dep:usbip"]  # Common USB/IP functionality for USB device protocols
usb-keyboard = ["usb-common"]  # USB HID Keyboard virtual device
usb-mouse = ["usb-common"]  # USB HID Mouse virtual device
usb-serial = ["usb-common"]  # USB CDC ACM Serial virtual device
usb-msc = ["usb-common", "memmap2"]  # USB Mass Storage Class virtual device (flash drive/disk)
# ring/std is required: ring only implements std::error::Error for Unspecified and
# KeyRejected under its `std` feature, and fido2 propagates both with `?` into anyhow.
# Without it this feature only compiled when some other enabled feature happened to
# turn ring/std on via feature unification.
usb-fido2 = ["usb-common", "ring", "ring/std", "serde_cbor"]  # USB FIDO2/U2F Security Key virtual device
usb-smartcard = ["usb-common"]  # Virtual USB CCID smart card reader over USB/IP. rsa/sha2 dropped with crypto.rs: the handler owns every response APDU, so the protocol holds no keys
usb = ["dep:nusb"]  # USB client for connecting to USB devices
openidconnect = ["dep:openidconnect", "urlencoding"]  # OpenID Connect client for authentication flows
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:rustls"]  # Kubernetes client protocol with v1.30 API support
# Kubernetes API *server*. Deliberately independent of the `kubernetes` client feature: kubectl
# speaks JSON to an apiserver by default, so this needs neither kube nor k8s-openapi - just the
# HTTP stack and rustls for the optional TLS listener. Pure Rust, no system library.
kubernetes-server = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen"]
git = ["dep:git2"]  # Git client support
mercurial = ["http", "urlencoding"]  # Mercurial HTTP server with LLM-controlled virtual repositories
kafka = ["dep:kafka-protocol"]  # Apache Kafka broker and client, both pure Rust on kafka-protocol (rdkafka/librdkafka removed - aborted in malloc)
# QUIC server (RFC 9000/9001): raw bidirectional QUIC streams under TLS 1.3. Deliberately
# NOT HTTP/3 - no RFC 9114 framing, no QPACK - so it needs neither h3 nor h3-quinn. See
# src/server/quic/CLAUDE.md.
quic = ["dep:quinn", "dep:rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:webpki-roots"]
# HTTP/3 client only (RFC 9114, via the h3 crate). Independent of `quic`: enabling this does
# NOT build the QUIC server, and the two cannot talk to each other.
http3 = ["dep:quinn", "dep:rustls", "dep:h3", "dep:h3-quinn"]
torrent-tracker = ["dep:serde_bencode", "urlencoding"]  # BitTorrent Tracker (HTTP-based peer discovery with announce/scrape)
torrent-dht = ["dep:serde_bencode"]  # BitTorrent DHT (Kademlia-based distributed peer discovery)
torrent-peer = ["dep:serde_bencode"]  # BitTorrent Peer Wire Protocol (peer-to-peer data transfer)
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:webpki-roots"]  # TLS server and client for custom protocols on top of encrypted transport
embedded-llm = ["dep:llama-cpp-2", "dep:hf-hub"]  # Embedded LLM inference via llama.cpp (fallback when Ollama unavailable)
sqlite = ["dep:rusqlite"]  # SQLite database support for protocols (in-memory or file-based)
# The rmcp `client` feature is enabled so the in-process MCP smoke tests can drive the server.
mcp-stdio = ["dep:rmcp", "dep:schemars", "rmcp/client"]  # MCP STDIO server mode for Claude Desktop/Code integration
mcp-http = ["dep:rmcp", "dep:schemars", "dep:axum", "rmcp/client", "rmcp/transport-streamable-http-server"]  # MCP HTTP/SSE server mode for remote/web MCP clients

# Prebuilt-binary release sets (GitHub Releases / npm @smotana/netget).
# Trim policy: a feature stays in a target's set iff it compiles for that target in CI
# AND adds no runtime dynamic-link dependency users may lack.
# Excluded everywhere: stun/turn (ancient nix 0.8 dep), smb-client (libsmbclient),
# embedded-llm (LLM backend, not a protocol; heavy llama.cpp build).
# Excluded on Linux: bluetooth-ble* (libdbus), nfc* (libpcsclite), datalink/arp/isis (libpcap).
# icmp is included here (not libpcap-gated: it only pulls in pnet's packet parsing +
# socket2 raw sockets). It builds on Linux/macOS because pnet_datalink's Linux (AF_PACKET)
# and macOS (BPF) backends are plain libc syscalls with no external link dependency. It is
# NOT added to dist-windows: pnet_datalink's Windows backend hard-links against WinPcap/
# Npcap's Packet.lib (#[link(name = "Packet")] in pnet_datalink::bindings::winpcap)
# unconditionally, regardless of which pnet module is actually used, and that SDK is not
# present on the windows-2022 CI runner.
dist = [
    "portable-base",
    "mcp-stdio",
    "mcp-http",
    # Pure-Rust protocols absent from android-termux for historical reasons only
    "websocket",
    "ftp",
    "tftp",
    "ospf",
    "openidconnect",
    "saml",
    "usb",
    # Unix-only VPNs; move out of dist if they break musl/windows legs
    "wireguard",
    "openvpn",
    "icmp",
    # Unix-only OS-IPC endpoint impersonation; #[cfg(unix)], safe on all dist (Linux) targets
    "named_pipe",
    "pty",
    "stdio",
]
# macOS ships CoreBluetooth, PC/SC, and libpcap with the OS, so these are safe to bundle.
dist-darwin = [
    "dist",
    "isis",   # libpcap ships with macOS
    "arp",    # ARP also just needs pnet + libpcap, same as isis/datalink above
    "bluetooth-ble",
    "bluetooth-ble-client",
    "bluetooth-ble-keyboard",
    "bluetooth-ble-mouse",
    "bluetooth-ble-beacon",
    "bluetooth-ble-remote",
    "bluetooth-ble-battery",
    "bluetooth-ble-heart-rate",
    "bluetooth-ble-thermometer",
    "bluetooth-ble-environmental",
    "bluetooth-ble-proximity",
    "bluetooth-ble-gamepad",
    "bluetooth-ble-presenter",
    "bluetooth-ble-file-transfer",
    "bluetooth-ble-data-stream",
    "bluetooth-ble-cycling",
    "bluetooth-ble-running",
    "bluetooth-ble-weight-scale",
    "nfc",
    "nfc-client",
    "datalink",
]
# Windows set: dist minus unix-gated features; refined by CI validation builds.
dist-windows = [
    "mcp-stdio",
    "mcp-http",
    "tcp",
