# Build the browser demo and publish docs/ (netget.net) to GitHub Pages.
#
# docs/ is the site as committed; docs/demo/pkg/ is built here from crates/netget-web and is
# never committed (see .gitignore). For this workflow to be what serves the site, the
# repository's Pages source must be set to "GitHub Actions" (Settings -> Pages); with the
# older "deploy from a branch: /docs" setting the page still loads, without the demo bundle,
# and shows a banner saying so.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'src/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-web

      - name: Install wasm-bindgen at the version Cargo.lock pins
        run: |
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          echo "wasm-bindgen $v"
          cargo install wasm-bindgen-cli --version "$v" --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build the demo bundle
        run: ./web/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Smoke-test the bundle headlessly
        run: node web/test/smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
