            printf 'PYTHONPATH=%s/forward-peers/python\n' "$RUNNER_TEMP"
            printf 'NETGET_FORWARD_PYTHON=python3\n'
            printf 'NETGET_FORWARD_RUBY=%s\n' "$(command -v ruby)"
            printf 'GEM_HOME=%s/forward-peers/ruby\n' "$RUNNER_TEMP"
            printf 'GEM_PATH=%s/forward-peers/ruby\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Both directions, all carriers and correlated ACKs
