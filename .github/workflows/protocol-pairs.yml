          key: protocol-pairs-${{ env.PAIR_FEATURES }}

      - name: Install required SSH client and server peers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler openssh-server openssh-client libssl-dev pkg-config
          sudo mkdir -p /run/sshd

      - name: Both roles, host pinning, SFTP bounds and cancellation
