name: Protocol pair interoperability

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-pairs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '4'
  PAIR_FEATURES: tcp,nut,doq,statsd

jobs:
  first-pairs:
    name: NUT, DoQ and StatsD with independent peers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ env.PAIR_FEATURES }}

      - name: Install build prerequisites and QUIC-capable Knot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libltdl-dev
          # Ubuntu's image includes Homebrew outside PATH. Its Knot formula enables
          # QUIC explicitly; merely installing an older distro kdig is insufficient.
          /home/linuxbrew/.linuxbrew/bin/brew install knot
          printf '%s\n' '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"

      - name: Prepare pinned independent peers in runner temporary storage
        run: |
          sh scripts/test-peers/build-nut.sh "$RUNNER_TEMP/nut-peer"
          python3 tests/server/statsd/install_peers.py "$RUNNER_TEMP/statsd-peer"
          sh scripts/test-peers/install-dnsproxy.sh "$RUNNER_TEMP/dnsproxy-peer"
          {
            printf 'NUT_UPSC_BIN=%s/nut-peer/nut-2.8.4/clients/upsc\n' "$RUNNER_TEMP"
            printf 'NUT_UPSCMD_BIN=%s/nut-peer/nut-2.8.4/clients/upscmd\n' "$RUNNER_TEMP"
            printf 'NUT_UPSD_BIN=%s/nut-peer/nut-2.8.4/server/upsd\n' "$RUNNER_TEMP"
            printf 'NUT_DUMMY_BIN=%s/nut-peer/nut-2.8.4/drivers/dummy-ups\n' "$RUNNER_TEMP"
            printf 'PYTHONPATH=%s/statsd-peer/statsd-python\n' "$RUNNER_TEMP"
            printf 'NODE_PATH=%s/statsd-peer/statsd-node/node_modules\n' "$RUNNER_TEMP"
            printf 'NETGET_DNSPROXY_BIN=%s/dnsproxy-peer/linux-amd64/dnsproxy\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Server and client suites including independent interoperability
        run: |
          for filter in \
            nut:: client/nut:: \
            doq:: client/doq:: \
            statsd:: client/statsd:: \
          ; do
            case "$filter" in
              client/*) target=client; filter=${filter#client/} ;;
              *) target=server ;;
            esac
            cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
              --test "$target" -- "$filter" --test-threads=4
          done

      - name: Protocol metadata and action wiring
        run: |
          cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
            --test event_action_declarations_test \
            --test advertised_actions_test \
            --test well_known_port_declaration_test \
            --test startup_param_defaults_test \
            --test startup_param_drift_test \
            --test protocol_startup_examples_test \
            --test dual_protocol_test \
            --test dashboard_wireshark_test \
            --test client_event_wiring_test \
            --test event_emit_sites_test

  stream-pairs:
    name: Graphite, queue, DICT, Gemini and raw QUIC with independent peers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PAIR_FEATURES: tcp,graphite,beanstalkd,dict,gemini,quic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ env.PAIR_FEATURES }}

      - name: Install independent queue and dictionary daemons
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler beanstalkd dictd dictfmt dict tshark

      - name: Prepare pinned independent Python peers
        run: |
          python3 tests/server/graphite/install_peers.py "$RUNNER_TEMP/stream-peers"
          python3 -m pip install --no-cache-dir --target "$RUNNER_TEMP/stream-peers/queue-python" greenstalk==2.1.1 ignition-gemini==1.0.0
          sh scripts/test-peers/fetch-agate.sh "$RUNNER_TEMP/stream-peers/agate"
          python3 -m venv "$RUNNER_TEMP/stream-peers/aioquic"
          "$RUNNER_TEMP/stream-peers/aioquic/bin/pip" install --no-cache-dir --only-binary=:all: aioquic==1.3.0
          {
            printf 'PYTHONPATH=%s/stream-peers/graphite-python:%s/stream-peers/graphite-python/opt/graphite/lib:%s/stream-peers/queue-python\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP"
            printf 'NETGET_GRAPHITE_PYTHON=python3\n'
            printf 'NETGET_TEST_AGATE=%s/stream-peers/agate/agate-3.3.24\n' "$RUNNER_TEMP"
            printf 'NETGET_AIOQUIC_PYTHON=%s/stream-peers/aioquic/bin/python\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Server and client suites including independent interoperability
        run: |
          for filter in \
            graphite:: client/graphite:: \
            beanstalkd:: client/beanstalkd:: \
            dict:: client/dict:: \
            gemini:: client/gemini:: \
            quic:: client/quic:: \
          ; do
            case "$filter" in
              client/*) target=client; filter=${filter#client/} ;;
              *) target=server ;;
            esac
            cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
              --test "$target" -- "$filter" --test-threads=4
          done

      - name: Shared metadata and task ownership
        run: |
          cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
            --test event_action_declarations_test \
            --test advertised_actions_test \
            --test well_known_port_declaration_test \
            --test startup_param_defaults_test \
            --test startup_param_drift_test \
            --test protocol_startup_examples_test \
            --test dual_protocol_test \
            --test dashboard_wireshark_test \
            --test client_event_wiring_test \
            --test event_emit_sites_test \
            --test task_registration_cancellation_test \
            --test server_task_registry_test \
            --test client_stop_releases_socket_test

  gelf-pairs:
    name: GELF TCP and UDP with independent emitters and collectors
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PAIR_FEATURES: tcp,gelf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ env.PAIR_FEATURES }}

      - name: Prepare pinned pygelf and official Graylog reader peers
        run: |
          python3 tests/server/gelf/install_peers.py "$RUNNER_TEMP/gelf-peers"
          {
            printf 'PYTHONPATH=%s/gelf-peers/python\n' "$RUNNER_TEMP"
            printf 'NETGET_GELF_PYTHON=python3\n'
            printf 'NETGET_GELF_READER=%s/gelf-peers/gelf-reader\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Both transports and directions with independent interoperability
        run: |
          for filter in \
            gelf:: client/gelf:: \
          ; do
            case "$filter" in
              client/*) target=client; filter=${filter#client/} ;;
              *) target=server ;;
            esac
            cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
              --test "$target" -- "$filter" --test-threads=4
          done

      - name: Shared registration, semantics and lifecycle checks
        run: |
          cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
            --test event_action_declarations_test \
            --test advertised_actions_test \
            --test well_known_port_declaration_test \
            --test startup_param_defaults_test \
            --test startup_param_drift_test \
            --test protocol_startup_examples_test \
            --test dual_protocol_test \
            --test dashboard_wireshark_test \
            --test client_event_wiring_test \
            --test event_emit_sites_test \
            --test task_registration_cancellation_test \
            --test server_task_registry_test \
            --test client_stop_releases_socket_test \
            --test failure_mode_declaration_test \
            --test detached_task_drift_test
