      - name: Shared Forward registration, silence and ownership checks
        run: |
          cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
            --test event_action_declarations_test \
            --test advertised_actions_test \
            --test startup_param_defaults_test \
            --test startup_param_drift_test \
            --test protocol_startup_examples_test \
            --test dual_protocol_test \
            --test dashboard_wireshark_test \
            --test client_event_wiring_test \
            --test event_emit_sites_test \
            --test task_registration_cancellation_test \
            --test server_task_registry_test \
            --test client_stop_releases_socket_test \
            --test failure_mode_declaration_test \
            --test detached_task_drift_test

  gearman-pairs:
    name: Gearman submitter and selected worker with independent peers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PAIR_FEATURES: tcp,gearman
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: protocol-pairs-${{ env.PAIR_FEATURES }}

      - name: Install bounded source-peer build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler build-essential curl ca-certificates pkg-config libtool gperf libevent-dev libboost-program-options-dev uuid-dev

      - name: Prepare pinned official Gearman daemon and tools
        run: |
          bash scripts/test-peers/install-gearman-linux.sh "$RUNNER_TEMP/gearman-peers"
          printf '%s/gearman-peers/bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Both roles, priority jobs, exceptions and lifecycle
        run: |
          for filter in \
            gearman:: client/gearman:: \
          ; do
            case "$filter" in
              client/*) target=client; filter=${filter#client/} ;;
              *) target=server ;;
            esac
            cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
              --test "$target" -- "$filter" --test-threads=4
          done

      - name: Shared registration and ownership checks
        run: |
          cargo test --locked --no-default-features --features "$PAIR_FEATURES" \
            --test event_action_declarations_test \
            --test advertised_actions_test \
            --test startup_param_defaults_test \
            --test startup_param_drift_test \
            --test protocol_startup_examples_test \
            --test dual_protocol_test \
            --test dashboard_wireshark_test \
            --test client_event_wiring_test \
            --test event_emit_sites_test \
            --test task_registration_cancellation_test \
            --test server_task_registry_test \
            --test client_stop_releases_socket_test

      - name: Preserve peer build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gearman-peer-build-${{ github.run_id }}
          path: ${{ runner.temp }}/gearman-peers/logs
          if-no-files-found: ignore
          retention-days: 7

  ssh-sftp-pairs:
    name: SSH and read-only SFTP with independent OpenSSH peers
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PAIR_FEATURES: tcp,ssh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
